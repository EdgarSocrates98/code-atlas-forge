[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-atlas-forge"
dynamic = ["version"]
description = "Plataforma local-first de inteligência estrutural de código — Cycle 4.1: retrieval, context packs, MCP e evidência canônica"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
]
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Edgar Socrates" }]
keywords = ["code-intelligence", "code-graph", "static-analysis", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.scripts]
code-atlas = "code_atlas.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "build>=1.2",
    # SDK oficial MCP — cliente real nos testes E2E (lf-0054);
    # ausente → testes skipped como NOT RUN, nunca fake.
    "mcp>=2.3.0",
]
vector = [
    # KNN nativo opcional (ADR-0022); sem ele o backend é bruteforce
    # stdlib — instalação mínima nunca baixa sqlite-vec.
    "sqlite-vec>=0.1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "code_atlas.__version__" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# fixtures golden são dados — incluem sintaxe quebrada e código
# propositalmente fora de estilo (ground truth, não source do projeto)
exclude = ["tests/golden/corpus", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["code_atlas"]
strict = true
warn_unused_ignores = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# corpus vendored é dado de eval (lf-0055), nunca suíte de testes
norecursedirs = ["tests/corpus"]
addopts = "-ra"
