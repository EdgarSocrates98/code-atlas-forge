[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-atlas-forge"
dynamic = ["version"]
description = "Plataforma local-first de inteligência estrutural de código — Cycle 1: foundation & contracts"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.23.6",
    "tree-sitter-typescript==0.23.2",
]
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Edgar Socrates" }]
keywords = ["code-intelligence", "code-graph", "static-analysis", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.scripts]
code-atlas = "code_atlas.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "code_atlas.__version__" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["code_atlas"]
strict = true
warn_unused_ignores = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
