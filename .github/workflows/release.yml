name: Release

# Trusted publishing to PyPI via GitHub Actions OIDC.
# No long-lived API tokens: the publish job exchanges an OIDC id-token
# for a short-lived PyPI credential (PyPI Trusted Publishers).
#
# Required GitHub settings (maintainer action, not automated here):
#   - Environment `pypi` configured on PyPI as a Trusted Publisher for
#     this repo + this workflow filename + tag ref pattern.
#   - Optional environment `testpypi` for validation runs.
#
# Triggering: pushing a tag `v*` runs build+attestation only (publish
# stays manual via workflow_dispatch). A maintainer then dispatches
# this workflow with `target: pypi|testpypi` to publish an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (requires a matching v* tag checked out)"
        type: choice
        options: ["testpypi", "pypi", "dry-run"]
        default: "dry-run"
      ref:
        description: "Tag ref to publish, e.g. refs/tags/v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build + verify artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve expected version
        id: meta
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME}"
          pkg_ver="$(python - <<'PY'
          import re, pathlib
          m = re.search(r'__version__\s*=\s*"([^"]+)"',
                        pathlib.Path('src/code_atlas/__init__.py').read_text())
          print(m.group(1))
          PY
          )"
          echo "version=$pkg_ver" >> "$GITHUB_OUTPUT"
          if [[ "$ref_name" == v* ]]; then
            tag_ver="${ref_name#v}"
            if [[ "$tag_ver" != "$pkg_ver" ]]; then
              echo "::error::tag v$tag_ver diverges from __version__ $pkg_ver"
              exit 1
            fi
          fi
          echo "tag=$ref_name package=$pkg_ver"

      - name: Install dev extras
        run: python -m pip install -e .[dev]

      - name: Release gates
        run: SKIP_E2E=1 bash scripts/release_check.sh --skip-e2e

      - name: Build wheel + sdist (reproducible)
        run: bash scripts/build_release.sh

      - name: Generate SBOM
        run: python scripts/generate_sbom.py

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Twine check
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish (${{ inputs.target }})
    runs-on: ubuntu-latest
    needs: build
    # Never publish from a PR-triggered context; manual dispatch or tag only.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target != 'dry-run'
    environment: ${{ inputs.target }}
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publishing — this job only
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ needs.build.outputs.version }}
          path: dist/

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
