name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dev extras
        run: python -m pip install -e .[dev]
      - name: Lint
        run: ruff check src tests
      - name: Typecheck
        run: mypy src
      - name: Test
        run: pytest -q --cov=code_atlas --cov-report=term-missing
      - name: Build wheel
        run: python -m build
      - name: Install wheel (clean)
        run: python -m pip install --force-reinstall --no-deps --find-links=dist code-atlas-forge
      - name: CLI smoke
        run: |
          code-atlas --version
          code-atlas doctor
          code-atlas index tests/fixtures/sample_repo --json
          code-atlas status --json

  pip-audit:
    name: dependency security (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + pip-audit
        run: |
          python -m pip install .[dev]
          python -m pip install "pip-audit>=2.7"
      - name: Audit dependencies
        run: |
          pip freeze | grep -v "code-atlas-forge" > reqs.txt
          pip-audit -r reqs.txt --strict
