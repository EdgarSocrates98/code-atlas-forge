openapi: 3.0.0
info:
  title: Pet Service
  version: 1.0.0
  description: Spec do workspace cross-domain (lf-0124)
servers:
  - url: https://api.test.example/v1
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: all pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pets'
    post:
      operationId: createPet
      responses:
        '201':
          description: created
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
    Pets:
      type: array
      items:
        $ref: '#/components/schemas/Pet'
