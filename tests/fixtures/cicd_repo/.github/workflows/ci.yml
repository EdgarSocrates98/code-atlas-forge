---
name: CI
on:
  push:
    branches: [main]
    paths:
      - "src/**"
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: ruff check src tests
  test:
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install -e .[dev]
      - name: Test
        run: pytest -q tests/
        env:
          TOKEN: ${{ secrets.CI_TOKEN }}
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: python -m build
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
