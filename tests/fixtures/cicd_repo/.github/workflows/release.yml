name: Release
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
jobs:
  call-reusable:
    uses: ./.github/workflows/reusable.yml
    secrets: inherit
  call-external:
    uses: octocat/hello-world/.github/workflows/reusable.yml@v1
  release:
    runs-on: ubuntu-latest
    needs: [call-reusable]
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        run: gh release create v${VERSION} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          push: true
  deploy:
    runs-on: [self-hosted, linux]
    needs: release
    environment:
      name: staging
    steps:
      - name: Roll out
        run: kubectl apply -f deploy/
